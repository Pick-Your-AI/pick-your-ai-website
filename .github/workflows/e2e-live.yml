name: E2E live

# Playwright checks against the production site after every successful deploy, daily, and on demand.
# Read-only: no secrets, no write permissions. Specs live in tests/e2e-live/.

on:
  # Runs trusted code from the default branch only; it never checks out code from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['Deploy production']
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: true

jobs:
  e2e-live:
    name: live site checks
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://pickyour.ai' }}
      # Only push-triggered deploys ship head_sha; rollbacks re-activate an older release.
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against production
        run: npx playwright test -c tests/e2e-live/playwright.live.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-results
          path: test-results/e2e-live/
          retention-days: 7
