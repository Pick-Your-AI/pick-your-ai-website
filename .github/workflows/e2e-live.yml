name: E2E live

# Playwright checks against the production site after every successful deploy, daily, and on demand.
# Read-only repository token for admission; no deployment secrets or write permissions.
# Specs live in tests/e2e-live/. Delayed-event admission: issue #318.

on:
  # Runs trusted code from the default branch only; it never checks out code from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['Deploy production']
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Read canonical deployment run/attempt/job metadata for admission.

concurrency:
  # Delayed events from different deploys cannot cancel one another. Only duplicate checks of
  # the same triggering execution share a group; scheduled/manual checks have separate groups.
  group: e2e-live-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-live:
    name: live site checks
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://pickyour.ai' }}
      # Only push-triggered deploys ship head_sha; rollbacks re-activate an older release.
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Admit live release
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_RECEIPT: ${{ runner.temp }}/live-admission.json
        run: node scripts/deploy/live-admission.mjs
      - if: steps.admission.outputs.decision == 'run'
        run: npm ci
      - if: steps.admission.outputs.decision == 'run'
        run: npx playwright install --with-deps chromium
      - name: Playwright against production
        if: steps.admission.outputs.decision == 'run'
        run: npx playwright test -c tests/e2e-live/playwright.live.config.ts
      - name: Retain live admission receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-admission
          path: ${{ runner.temp }}/live-admission.json
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-results
          path: test-results/e2e-live/
          retention-days: 7
